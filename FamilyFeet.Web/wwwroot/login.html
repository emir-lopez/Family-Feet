<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar Sesión | Family Feet</title>
    <meta name="theme-color" content="#0a3042">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="header-container"></div>
    <main id="main">
        <section class="page-hero" aria-labelledby="page-title">
            <div class="container" style="text-align: center;">
                <span class="eyebrow">Portal de acceso</span>
                <h1 id="page-title">Sistema de Reservaciones</h1>
            </div>
        </section>

        <section class="section" style="padding-top: 3rem;">
            <div class="container">
                <div class="panel" style="max-width: 26rem; margin: 0 auto; background: var(--white); box-shadow: var(--shadow-md);">
                    <h2 style="text-align: center; margin-bottom: 1.5rem;">Iniciar Sesión</h2>

                    <!-- ID agregado y action removido para usar JS Fetch -->
                    <form id="form-login" class="form">
                        <div class="field field--full">
                            <label for="email">Correo electrónico</label>
                            <input type="email" id="email" name="email" required placeholder="admin@familyfeet.com">
                        </div>
                        <div class="field field--full">
                            <label for="password">Contraseña</label>
                            <input type="password" id="password" name="password" required placeholder="********">
                        </div>
                        <div class="field field--full" style="margin-top: 1rem;">
                            <button type="submit" class="btn" style="width: 100%;">
                                Ingresar al Sistema <span class="icon icon-arrow" aria-hidden="true"></span>
                            </button>
                        </div>
                    </form>

                    <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--muted);">
                        ¿Eres paciente y no tienes cuenta? <a href="contact.html">Solicítala aquí</a>.
                    </p>
                </div>
            </div>
        </section>
    </main>
    <script src="js/main.js" defer></script>
</body>
</html>
